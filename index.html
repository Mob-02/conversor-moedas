<!DOCTYPE html>
<html lang="pt-br">
<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Conversor de Moedas  </title>
	<link rel="stylesheet" href="style.css">

</head>

<body>
	<div class="container">
		<h1>Conversor de Moedas</h1>
	
	<div class="form-group">
		<label for="quantidade">Valor:</label>
	<input type="number" id="quantidade" placeholder="Ex: 100"  value="1">

	</div>

	<div class="moedas-container">
		<div class="form-group">
			<label for="moeda-origem">De:</label>
			<select id="moeda-origem">
				<option value="BRL">BRL (Real)</option>
				<option value="USD" selected>USD (Dólar)</option>
				<option value="EUR">EUR (Euro)</option>
				<option value="GBP">GBP (Libra)</option>
			</select>
		</div>

		<div class="form-group">
		<label for="moeda-destino">Para:</label>
		<select id="moeda-destino">
			<option value="BRL" selected>BRL (Real)</option>
			<option value="USD">USD (Dólar)</option>
			<option value="EUR">EUR (Euro)</option>
			<option value="GBP">GBP (Libra)</option>
		</select>

		</div>
	</div>
	
	<button id="btn-converter">Converter</button>

	<div id="resultado" class="escondido">
		<p id="texto-resultado"></p>
	</div>
	</div>
	
	<script src="script.js"></script>

</body>
</html>
